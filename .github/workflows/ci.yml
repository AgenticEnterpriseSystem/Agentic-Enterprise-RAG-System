name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run smoke test
        run: python -m pytest
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web application
        working-directory: frontend
        run: npm ci && npm run build
      - name: Check Docker application
        env:
          RAG_MODE: fixture
          RAG_ALLOW_PAID: 'false'
          WEB_PORT: '18080'
        run: |
          docker compose up --build -d
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          base = 'http://127.0.0.1:18080'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + '/api/ready', timeout=2) as response:
                      assert json.load(response)['mode'] == 'fixture'
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise RuntimeError('Docker app never became ready')
          with urllib.request.urlopen(base) as response:
              assert b'/assets/' in response.read()
          for mode in ('baseline', 'agentic'):
              request = urllib.request.Request(base + '/api/query',
                  data=json.dumps({'question': 'How long are artifacts retained?', 'mode': mode}).encode(),
                  headers={'Content-Type': 'application/json', 'Origin': base})
              with urllib.request.urlopen(request) as response:
                  body = json.load(response)
                  assert body['answer']['status'] == 'answered'
                  assert body['answer']['citation_ids'][0] == body['sources'][0]['citation_id']
          PY
      - name: Stop Docker application
        if: always()
        run: docker compose down
