name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # Synthetic credentials for a disposable loopback-only CI database.
    env:
      RAG_TEST_PG_CONTAINER: rag-ci-postgres
      RAG_TEST_ADMIN_URL: postgresql+psycopg://postgres:ci-admin-only@127.0.0.1:15432/rag_test_ci
      RAG_TEST_MIGRATION_URL: postgresql+psycopg://rag_migrator:ci-migrator-only@127.0.0.1:15432/rag_test_ci
      RAG_TEST_RUNTIME_URL: postgresql+psycopg://rag_runtime:ci-runtime-only@127.0.0.1:15432/rag_test_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Start isolated PostgreSQL
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: rag_test_ci
          POSTGRES_PASSWORD: ci-admin-only
          RAG_DB_MIGRATOR_PASSWORD: ci-migrator-only
          RAG_DB_RUNTIME_PASSWORD: ci-runtime-only
        run: |
          docker run -d --name rag-ci-postgres --label rag.task=DB-01 --memory 512m --memory-swap 512m --cpus 1 \
            -p 127.0.0.1:15432:5432 \
            --env POSTGRES_USER --env POSTGRES_DB --env POSTGRES_PASSWORD \
            --env RAG_DB_MIGRATOR_PASSWORD --env RAG_DB_RUNTIME_PASSWORD \
            --mount "type=bind,source=$PWD/docker/postgres/init.sh,target=/docker-entrypoint-initdb.d/10-roles.sh,readonly" \
            postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5 \
            postgres -c shared_buffers=32MB -c work_mem=4MB -c maintenance_work_mem=32MB -c max_connections=20
          python - <<'PYTHON'
          import subprocess, time
          for attempt in range(40):
              result = subprocess.run(['docker', 'exec', 'rag-ci-postgres', 'pg_isready',
                  '-h', '127.0.0.1', '-U', 'postgres', '-d', 'rag_test_ci'], capture_output=True)
              if result.returncode == 0:
                  break
              time.sleep(.5)
          else:
              raise RuntimeError('Isolated test database did not become ready')
          PYTHON
      - name: Run smoke test
        run: python -m pytest
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web application
        working-directory: frontend
        run: npm ci && npm run build
      - name: Check Docker application
        env:
          RAG_MODE: fixture
          RAG_ALLOW_PAID: 'false'
          WEB_PORT: '18080'
        run: |
          docker compose up --build -d
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          base = 'http://127.0.0.1:18080'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + '/api/ready', timeout=2) as response:
                      assert json.load(response)['mode'] == 'fixture'
                  break
              except (urllib.error.URLError, TimeoutError, ConnectionError):
                  time.sleep(1)
          else:
              raise RuntimeError('Docker app never became ready')
          with urllib.request.urlopen(base) as response:
              assert b'/assets/' in response.read()
          for mode in ('baseline', 'agentic'):
              request = urllib.request.Request(base + '/api/query',
                  data=json.dumps({'question': 'How long are artifacts retained?', 'mode': mode}).encode(),
                  headers={'Content-Type': 'application/json', 'Origin': base})
              with urllib.request.urlopen(request) as response:
                  body = json.load(response)
                  assert body['answer']['status'] == 'answered'
                  assert body['answer']['citation_ids'][0] == body['sources'][0]['citation_id']
          PY
      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 app
      - name: Stop Docker application
        if: always()
        run: docker compose down
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker rm -f rag-ci-postgres
