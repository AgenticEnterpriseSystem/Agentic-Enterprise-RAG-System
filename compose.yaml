services:
  app:
    build:
      context: .
      args:
        INSTALL_HYBRID: ${INSTALL_HYBRID:-false}
    # Publish only on this computer. Authentication is still a benchmark demo.
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    init: true
    # Full-corpus process exit has lagged application shutdown by ~33 seconds.
    # Allow cleanup before Docker escalates to SIGKILL (default: 10 seconds).
    stop_grace_period: 60s
    restart: "no"
    environment:
      RAG_MODE: ${RAG_MODE:-fixture}
      RAG_DEMO_ACCESS: ${RAG_DEMO_ACCESS:-true}
      RAG_RETRIEVAL: ${RAG_RETRIEVAL:-hybrid}
      RAG_CORPUS: ${RAG_CORPUS:-/data/documents.parquet}
      RAG_BM25_INDEX: ${RAG_BM25_INDEX:-/data/indexes/bm25}
      RAG_DENSE_INDEX: ${RAG_DENSE_INDEX:-/data/indexes/dense-bge-base}
      RAG_DEVICE: cpu
      RAG_FP16: ${RAG_FP16:-}
      RAG_BM25_WEIGHT: ${RAG_BM25_WEIGHT:-0.7}
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-50}
      RAG_RERANK_K: ${RAG_RERANK_K:-50}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_ALLOWED_DOC_IDS_FILE: ${RAG_ALLOWED_DOC_IDS_FILE:-}
      RAG_ALLOWED_SOURCES: ${RAG_ALLOWED_SOURCES:-}
      RAG_ALLOWED_ORIGINS: "http://127.0.0.1:${WEB_PORT:-8000},http://localhost:${WEB_PORT:-8000},${RAG_ALLOWED_ORIGINS:-}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAG_ALLOW_PAID: ${RAG_ALLOW_PAID:-false}
      RAG_MODEL: ${RAG_MODEL:-}
      RAG_BUDGET_USD: ${RAG_BUDGET_USD:-0}
      RAG_INPUT_PRICE: ${RAG_INPUT_PRICE:-0}
      RAG_OUTPUT_PRICE: ${RAG_OUTPUT_PRICE:-0}
      RAG_QUESTION_BUDGET_USD: ${RAG_QUESTION_BUDGET_USD:-0.1}
      RAG_MAX_SECONDS: ${RAG_MAX_SECONDS:-120}
      RAG_MAX_TOKENS: ${RAG_MAX_TOKENS:-16000}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-24000}
      RAG_MAX_ROUNDS: ${RAG_MAX_ROUNDS:-2}
      RAG_TOP_K: ${RAG_TOP_K:-5}
    volumes:
      - "${ARTIFACTS_DIR:-./.cache/hybrid-artifacts}:/data:ro"
      - model-cache:/app/.cache/models

  db:
    profiles: [database]
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    # Internal-only: no host port, no real application accounts are seeded.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${RAG_DB_BOOTSTRAP_PASSWORD:-}
      RAG_DB_MIGRATOR_PASSWORD: ${RAG_DB_MIGRATOR_PASSWORD:-}
      RAG_DB_RUNTIME_PASSWORD: ${RAG_DB_RUNTIME_PASSWORD:-}
    command: [postgres, -c, shared_buffers=32MB, -c, work_mem=4MB, -c, maintenance_work_mem=32MB, -c, max_connections=20]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1
    pids_limit: 128
    restart: "no"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d rag"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro

  migrate:
    profiles: [migrations]
    build:
      context: .
      args:
        INSTALL_HYBRID: "false"
    command: [python, -m, src.db.migrate]
    healthcheck:
      disable: true
    restart: "no"
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 1
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAG_DB_HOST: db
      RAG_DB_NAME: rag
      RAG_DB_USER: rag_migrator
      RAG_DB_PASSWORD: ${RAG_DB_MIGRATOR_PASSWORD:-}


  import-corpus:
    profiles: [imports]
    build:
      context: .
      args:
        INSTALL_HYBRID: "false"
    # Run the migration profile first. Import credentials never reach the app.
    command: [python, -m, src.data.import_catalog, --corpus, /data/documents.parquet,
              --dense-directory, /data/indexes/dense-bge-base,
              --snapshot-id, "${RAG_SNAPSHOT_ID:-enterprise-bge-base-canonical}"]
    healthcheck:
      disable: true
    restart: "no"
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAG_DB_HOST: db
      RAG_DB_NAME: rag
      RAG_DB_USER: rag_migrator
      RAG_DB_PASSWORD: ${RAG_DB_MIGRATOR_PASSWORD:-}
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
    volumes:
      - "${ARTIFACTS_DIR:-./.cache/hybrid-artifacts}:/data:ro"

volumes:
  model-cache:
  postgres-data:
